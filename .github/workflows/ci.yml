name: SignalForge CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  lint-test-security:
    name: Code Quality, Security & Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.1.7

      - name: Set up Python 3.11
        uses: actions/setup-python@v5.1.1
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Pinned Dependencies
        run: |
          python -m pip install --upgrade pip==24.0
          pip install -r requirements.txt

      - name: Lint with Ruff
        run: |
          ruff check .

      - name: Static Type Checking with Mypy
        run: |
          mypy src/

      - name: Security Static Analysis with Bandit
        run: |
          bandit -r src/ -x tests/ -ll

      - name: Dependency Vulnerability Audit with pip-audit
        run: |
          pip-audit

      - name: CloudFormation & SAM Linting with cfn-lint
        run: |
          cfn-lint template.yaml

      - name: Run Test Suite with Coverage
        env:
          AWS_ACCESS_KEY_ID: testing
          AWS_SECRET_ACCESS_KEY: testing
          AWS_SECURITY_TOKEN: testing
          AWS_SESSION_TOKEN: testing
          AWS_DEFAULT_REGION: us-east-1
          FEEDBACK_TABLE_NAME: SignalForgeTestTable
          ALERTS_TOPIC_ARN: arn:aws:sns:us-east-1:123456789012:test-alerts
        run: |
          pytest --cov=src/signalforge --cov-report=term-missing --cov-fail-under=80
